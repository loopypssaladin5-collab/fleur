<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fleur 3D | Expérience Interactive</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0a0a;
    font-family:'Montserrat','Arial Black','Segoe UI',sans-serif;
  }

  #galaxy-canvas{
    position:fixed; inset:0; width:100%; height:100%; z-index:0;
  }

  /* ---------- Ecran de depart ---------- */
  #start-container{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
  }

  .container{ position:relative; }

  .container::before{
    content:"";
    position:absolute; inset:-6px; margin:auto;
    border-radius:3rem; z-index:-1;
    background:linear-gradient(90deg,#ff4fa3,#4fc3ff,#ff4fa3);
    background-size:200% 200%;
    filter:blur(0);
    animation:gradientMove 3s ease infinite;
    transition:filter .4s ease;
  }
  .container:hover::before{ filter:blur(1.2em); }

  @keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .button{
    font-size:1.5rem;
    padding:0.8em 1.8em;
    border-radius:3rem;
    border:none;
    background-color:#0a0a0a;
    color:#fff;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.6);
    transition:transform .2s, background .2s;
    font-family:inherit;
  }
  .button:active{ transform:scale(0.96); }

  /* ---------- Scene principale ---------- */
  #main-content{
    position:fixed; inset:0; z-index:5;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
  }

  .wrapper{
    position:relative;
    width:70vmin; height:70vmin;
    display:flex; align-items:center; justify-content:center;
    perspective:1200px;
  }

  .flower{
    position:relative;
    width:1px; height:1px;
    transform-style:preserve-3d;
    animation:swayFlower 6s ease-in-out infinite;
  }
  @keyframes swayFlower{
    0%,100%{ transform:rotateY(-18deg) rotateX(8deg); }
    50%{ transform:rotateY(18deg) rotateX(8deg); }
  }

  .petal{
    position:absolute; top:0; left:0;
    width:1px; height:1px;
    margin:0;
    transform-origin:0 0;
    transform-style:preserve-3d;
    transition:transform 1.4s cubic-bezier(.34,1.4,.4,1), opacity .8s ease;
  }

  .petal-cone{
    position:absolute; top:0; left:0;
    width:0; height:0;
    transform-style:preserve-3d;
  }

  .dot{
    position:absolute; top:0; left:0;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ff9fc9, #ff2d78 55%, #c2005c 100%);
    transform:translate(-50%,-50%);
  }

  .pistil{
    position:absolute; top:50%; left:50%;
    width:9vmin; height:6vmin;
    margin:-3vmin 0 0 -4.5vmin;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, #ffb3d9 45%, #ff2d78 100%);
    box-shadow:0 0 30px #ff5fa8, 0 0 60px rgba(255,45,120,.6);
    transform:translateZ(2vmin);
  }

  /* etat ferme (avant eclosion) */
  .wrapper.closed .petal{
    transform: rotateZ(var(--ang)) rotateX(80deg) scale(0.05);
    opacity:0;
  }
  .wrapper.closed .pistil{ transform:translateZ(2vmin) scale(.3); opacity:0; }

  /* etat ouvert (fleur epanouie) */
  .wrapper.open .petal{
    transform: rotateZ(var(--ang)) rotateX(22deg) scale(1);
    opacity:1;
  }
  .wrapper.open .pistil{ transform:translateZ(2vmin) scale(1); opacity:1; }
  .pistil{ transition:transform 1.2s cubic-bezier(.34,1.4,.4,1), opacity .8s ease; }

  .message{
    margin-top:4vh;
    font-size:1.6rem;
    font-weight:bold;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 12px #ff4fa3, 0 0 24px rgba(255,79,163,.6);
    background:rgba(20,0,15,.35);
    padding:.6em 1.2em;
    border-radius:1.4em;
    opacity:0;
    transition:opacity .6s ease;
    text-align:center;
    max-width:85vw;
  }
  .message.show{ opacity:1; }

  #music-controls{
    position:fixed;
    bottom:5vh; left:6vw;
    z-index:999;
    display:none;
  }
  #music-btn{
    background:linear-gradient(135deg,#ff007b,#ff4fa3);
    border:none;
    padding:12px 28px;
    border-radius:50px;
    color:#fff;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 0 12px rgba(255,0,123,.6);
    transition:transform .2s, box-shadow .2s;
    font-family:inherit;
    letter-spacing:1px;
  }
  #music-btn:hover{ transform:scale(1.04); box-shadow:0 0 20px #ff007b; }
  #music-btn:active{ transform:scale(.96); }

  @media (max-width:600px){
    .message{ font-size:1.25rem; }
    .button{ font-size:1.2rem; }
  }
</style>
</head>
<body>

<canvas id="galaxy-canvas"></canvas>

<div id="start-container">
  <div class="container">
    <button id="start-btn" class="button" disabled></button>
  </div>
</div>

<div id="main-content">
  <div class="wrapper closed" id="wrapper">
    <div class="flower" id="flower"></div>
  </div>
  <div class="message" id="msg"></div>
</div>

<div id="music-controls">
  <button id="music-btn">🎵 MUSIQUE</button>
</div>

<audio id="bg-music" preload="auto" loop>
  <!-- Depose ton fichier mp3 en base64 ici si tu veux la musique -->
  Ton navigateur ne supporte pas l'audio.
</audio>

<script>
(function(){
  // ---------- Fond galaxie ----------
  const canvas = document.getElementById('galaxy-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function initGalaxy(){
    resize();
    stars = [];
    const count = Math.floor((canvas.width*canvas.height)/6000);
    for(let i=0;i<count;i++){
      stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.4+0.3,
        s:Math.random()*0.02+0.005,
        a:Math.random()*Math.PI*2
      });
    }
  }
  function drawGalaxy(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(const st of stars){
      st.a += st.s;
      const alpha = 0.5 + Math.sin(st.a)*0.5;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(drawGalaxy);
  }
  window.addEventListener('resize', initGalaxy);
  initGalaxy();
  drawGalaxy();

  // ---------- Texte machine a ecrire du bouton ----------
  const startBtn = document.getElementById('start-btn');
  const fullText = "Appuie 🌸";
  let idx = 0;
  function addChar(){
    if(idx < fullText.length){
      startBtn.textContent += fullText.charAt(idx);
      idx++;
      setTimeout(addChar, 80);
    } else {
      startBtn.disabled = false;
    }
  }
  addChar();

  // ---------- Creation de la fleur (5 petales en points 3D) ----------
  const flower = document.getElementById('flower');
  const NUM_PETALS = 5;
  const MAX_R = 8.5;      // vmin, rayon max de la corolle (dome)
  const LEN   = 19;       // vmin, longueur du petale
  const ROWS  = 13;
  const DOT_D = 1.55;     // vmin, diametre d'un point
  const SPACING = 1.9;    // vmin, espacement approx entre points sur un anneau

  function buildPetalCone(){
    const cone = document.createElement('div');
    cone.className = 'petal-cone';
    for(let row=1; row<=ROWS; row++){
      const t = row/ROWS;                 // 0 (centre) -> 1 (bord exterieur)
      const r = MAX_R * Math.sin(Math.pow(t,0.62) * Math.PI/2);
      const y = -t*LEN;                   // vers le "haut" du cone local
      const circumf = 2*Math.PI*Math.max(r,0.001);
      let cols = Math.max(5, Math.round(circumf/SPACING));
      if(row===ROWS) cols = Math.max(cols, 10); // dome bien rempli
      const rowStagger = (row%2)*(Math.PI/cols);
      for(let c=0;c<cols;c++){
        const theta = c*(2*Math.PI/cols) + rowStagger;
        const x = r*Math.sin(theta);
        const z = r*Math.cos(theta);
        const dot = document.createElement('div');
        dot.className = 'dot';
        const size = DOT_D * (0.75 + 0.35*t); // points un peu plus gros vers l'exterieur
        dot.style.width = size+'vmin';
        dot.style.height = size+'vmin';
        dot.style.transform = `translate3d(${x}vmin, ${y}vmin, ${z}vmin) translate(-50%,-50%)`;
        cone.appendChild(dot);
      }
    }
    return cone;
  }

  for(let i=0;i<NUM_PETALS;i++){
    const angle = (360/NUM_PETALS)*i;
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.setProperty('--ang', angle+'deg');
    petal.style.transitionDelay = (i*0.09)+'s';
    petal.appendChild(buildPetalCone());
    flower.appendChild(petal);
  }
  const pistil = document.createElement('div');
  pistil.className = 'pistil';
  flower.appendChild(pistil);

  // ---------- Messages en francais (traduction fidele) ----------
  const messages = [
    "Je t'aime ❤️",
    "Tu es tout pour moi 💝",
    "Je t'adore 🥰",
    "Mon amour 💗",
    "Seulement toi 💕",
    "Mon cœur 💖",
    "Tu es spéciale ✨",
    "Toujours toi ❤️",
    "Mon bonheur 💗",
    "Je te choisis, toi 💝",
    "Ma princesse 👸",
    "Ma vie ❤️",
    "Ma raison d'être 💓",
    "Reste avec moi 😊",
    "Tu es parfaite 💓",
    "Mon monde 🌍",
    "Mon inspiration ✨",
    "Mon destin 💫",
    "Mon étoile ⭐",
    "Mon trésor 💎",
    "Mon rêve 🌙",
    "Ma joie 😊",
    "Mon ange 💗",
    "Je pense à toi 💭",
    "Tu me manques 🥺",
    "Mon espoir 💫",
    "Ma préférée pour toujours 💗",
    "Mon bonheur, c'est toi 💞",
    "Avec toi, pour toujours 💑"
  ];

  const wrapper = document.getElementById('wrapper');
  const msgDiv = document.getElementById('msg');
  const mainContent = document.getElementById('main-content');
  const musicControls = document.getElementById('music-controls');
  const musicBtn = document.getElementById('music-btn');
  const audio = document.getElementById('bg-music');
  let musicPlaying = false;
  let msgIndex = 0;
  let cycleTimer = null;

  function showMessage(){
    msgDiv.classList.remove('show');
    setTimeout(()=>{
      msgDiv.textContent = messages[msgIndex % messages.length];
      msgDiv.classList.add('show');
      msgIndex++;
    }, 300);
  }

  function startExperience(){
    document.getElementById('start-container').style.display = 'none';
    mainContent.style.display = 'flex';
    musicControls.style.display = 'block';

    showMessage();

    // La fleur reste fermee le temps de 2 messages, puis s'ouvre
    setTimeout(()=>{
      wrapper.classList.remove('closed');
      wrapper.classList.add('open');
    }, 3600);

    cycleTimer = setInterval(showMessage, 3600);

    // tentative de lecture audio (peut etre bloquee tant qu'il n'y a pas eu d'interaction ; on est deja dans un clic donc ok)
    audio.play().then(()=>{
      musicPlaying = true;
      musicBtn.textContent = '⏸ PAUSE';
    }).catch(()=>{
      musicPlaying = false;
      musicBtn.textContent = '🎵 MUSIQUE';
    });
  }

  startBtn.addEventListener('click', ()=>{
    if(startBtn.disabled) return;
    startExperience();
  });

  musicBtn.addEventListener('click', ()=>{
    if(musicPlaying){
      audio.pause();
      musicPlaying = false;
      musicBtn.textContent = '🎵 MUSIQUE';
    } else {
      audio.play().then(()=>{
        musicPlaying = true;
        musicBtn.textContent = '⏸ PAUSE';
      }).catch(()=>{});
    }
  });

})();
</script>
</body>
</html>
